---
# Builds a Windows test copy of the Android engine (touch emulated with the
# mouse). Download "CorsixTH-Windows-touch-test" from the run's Artifacts.
name: Windows

on:  # yamllint disable-line rule:truthy
  push:
    branches:
      - 'AndroidDev'
  workflow_dispatch:

jobs:
  Windows:
    runs-on: windows-2022
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: Set up vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg "$env:RUNNER_TEMP/vcpkg"
          git -C "$env:RUNNER_TEMP/vcpkg" checkout 054bd01bec7f31492ec9ac063740cc984a0fe59e
          & "$env:RUNNER_TEMP/vcpkg/bootstrap-vcpkg.bat" -disableMetrics
          "VCPKG_ROOT=$env:RUNNER_TEMP/vcpkg" >> $env:GITHUB_ENV
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP/vcpkg-cache" | Out-Null
          "VCPKG_DEFAULT_BINARY_CACHE=$env:RUNNER_TEMP/vcpkg-cache" >> $env:GITHUB_ENV
          # lua.org is often unreachable; pre-fetch the identical tarball from a
          # mirror (vcpkg still checks its SHA512).
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP/vcpkg/downloads" | Out-Null
          curl.exe -fsSL --retry 3 -o "$env:RUNNER_TEMP/vcpkg/downloads/lua-5.4.8.tar.gz" https://ftp.openbsd.org/pub/OpenBSD/distfiles/lua-5.4.8.tar.gz

      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/vcpkg-cache
          key: vcpkg-bin-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-bin-${{ runner.os }}-

      - name: Create Project
        run: cmake -G "Visual Studio 17 2022" -DUSE_VCPKG_DEPS=ON -DVCPKG_MANIFEST_DEPS=ON -DVCPKG_TARGET_TRIPLET=x64-windows-release -DWITH_MOVIES=OFF -DENABLE_UNIT_TESTS=OFF -Bbuild .

      - name: Build
        run: cmake --build build/ --config RelWithDebInfo

      - name: Download soundfont
        run:
          aria2c -d build/CorsixTH/RelWithDebInfo https://github.com/Jacalz/fluid-soundfont/raw/master/SF3/FluidR3.sf3

      - name: Copy data files for archive
        run: |
          cp -R CorsixTH/Lua build/CorsixTH/RelWithDebInfo/Lua
          cp -R CorsixTH/Bitmap build/CorsixTH/RelWithDebInfo/Bitmap
          cp -R CorsixTH/Levels build/CorsixTH/RelWithDebInfo/Levels
          cp -R CorsixTH/Campaigns build/CorsixTH/RelWithDebInfo/Campaigns
          cp CorsixTH/CorsixTH.lua build/CorsixTH/RelWithDebInfo/

      - name: Archive Release
        uses: actions/upload-artifact@v4
        with:
          path: build/CorsixTH/RelWithDebInfo
          name: CorsixTH-Windows-touch-test
